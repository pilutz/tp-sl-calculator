name: Publică aplicația web

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descarcă sursa
        uses: actions/checkout@v4
      - name: Configurează GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Pregătește site-ul
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Publică
        id: deployment
        uses: actions/deploy-pages@v4
